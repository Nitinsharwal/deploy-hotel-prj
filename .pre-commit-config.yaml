# pre-commit hooks run on every `git commit` after `pre-commit install`.
# Install once:   pip install pre-commit && pre-commit install
# Run manually:   pre-commit run --all-files

# Exclude generated / vendored content from every hook. `staticfiles/` is
# Django's `collectstatic` output — not source code. `migrations/` are
# auto-generated by Django and should match its house style, not ours.
exclude: |
  (?x)^(
    staticfiles/.*|
    .*/migrations/.*|
    media/.*|
    \.venv/.*|
    hotel_app/seed\.py
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff           # lint
        args: [--fix]
      - id: ruff-format    # format (black-compatible)
