# pre-commit hooks run on every `git commit` after `pre-commit install`.
# Install once:   pip install pre-commit && pre-commit install
# Run manually:   pre-commit run --all-files

# Exclude generated / vendored content from every hook. `staticfiles/` is
# Django's `collectstatic` output — not source code. `migrations/` are
# auto-generated by Django and should match its house style, not ours.
exclude: |
  (?x)^(
    staticfiles/.*|
    .*/migrations/.*|
    media/.*|
    \.venv/.*|
    hotel_app/seed\.py
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff           # lint
        args: [--fix]
      - id: ruff-format    # format (black-compatible)

  # Local hook — block multi-line `{# ... #}` Django comments before they
  # land in git. Django renders any `{# #}` that doesn't close on the same
  # line as visible text past the first line, which has caused FIVE
  # production bugs in this codebase. `{% comment %}...{% endcomment %}`
  # is the only safe form for anything longer than one line.
  # Implementation: see scripts/check_django_comments.py
  - repo: local
    hooks:
      - id: no-multiline-django-comments
        name: Block multi-line {# #} Django comments
        entry: python scripts/check_django_comments.py
        language: system
        files: '\.html$'
