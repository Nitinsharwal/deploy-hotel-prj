name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    # Job-level env: every step inherits these, so we don't have to repeat
    # them on each step. pytest-django imports Django settings DURING the
    # `pytest_load_initial_conftests` hook (before our conftest.py top-level
    # code runs), so setting SECRET_KEY in conftest is too late. Setting it
    # here means the Python process already has it when Django boots.
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: "testserver,localhost,127.0.0.1"
      AXES_ENABLED: "False"
      # Empty REDIS_URL → falls back to LocMemCache; no Redis service needed in CI.
      REDIS_URL: ""

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: pytest -v
