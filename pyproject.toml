# Shared config for ruff (lint + format) and any other tools that read pyproject.
#
# We keep `requirements.txt` as the single source of truth for dependencies
# (pip-installable, simple to read, plays nice with every host). The [project]
# table below exists ONLY so package managers like uv — which Vercel now uses
# during deploy — find valid project metadata. They read deps from the file
# referenced under [tool.setuptools.dynamic].

[project]
name = "noma-hotel"
version = "0.1.0"
description = "Django-based hotel booking platform (Noma)."
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# We're a deployable Django app, not a pip-installable library — there is
# nothing for setuptools to discover and bundle. Without this, auto-discovery
# trips on directories like `hotels/` and `profile/` (which hold uploaded
# images, not Python code) and the build crashes.
[tool.setuptools]
packages = []

# uv-specific: explicitly tell uv NOT to build/install the project itself,
# just resolve and install dependencies from requirements.txt. This is the
# correct mode for an "application" rather than a "library".
[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "migrations",
  ".venv",
  "staticfiles",
  "media",
  "hotel_app/seed.py",   # one-off Faker script, uses star imports intentionally
]

[tool.ruff.lint]
# Keep the rule set tight on purpose — too many rules == merge-conflict factory.
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "DJ",   # flake8-django
]
ignore = [
  "E501",  # let the formatter handle long lines
  "B008",  # function calls in argument defaults are common in Django
]

[tool.ruff.lint.per-file-ignores]
"**/settings.py" = ["F403", "F405"]   # star imports are fine here
"**/__init__.py" = ["F401"]            # re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
